name: Idea or feature request
description: Something Matita should do, or do better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation (e.g. "I record weekly 1:1s and want…"). The goal matters more than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
