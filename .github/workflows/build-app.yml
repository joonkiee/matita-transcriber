name: Build Matita (Mac and Windows)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<VERSION from matita.py>) with the Mac .dmg and the Windows installer"
        type: boolean
        default: false
  push:
    branches: [app]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15            # Apple Silicon (builds for macOS 14 and later)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache tools (whisper.cpp, ffmpeg, Python)
        uses: actions/cache@v4
        with:
          path: |
            .build/whisper
            .build/ffmpeg
            .build/python
          key: tools-v1-whisper-v1.9.5-ffmpeg-7.1.1-py3.12

      - name: Build the app and the disk image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-app.sh

      - name: Smoke test on this Mac
        run: |
          set -euo pipefail
          APP=dist/Matita.app; R=$APP/Contents/Resources
          export HOME=$RUNNER_TEMP/home; mkdir -p "$HOME"
          echo "-- tools"
          "$R/bin/ffmpeg" -hide_banner -version | head -1
          "$R/bin/whisper-cli" --help 2>&1 | grep -q -- "--vad" && echo "whisper-cli has VAD"
          echo "-- a real transcription with the bundled whisper-cli + ffmpeg"
          say -o "$RUNNER_TEMP/t.aiff" "Matita turns your recordings into text on your Mac."
          "$R/bin/ffmpeg" -nostdin -loglevel error -y -i "$RUNNER_TEMP/t.aiff" -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/t.wav"
          curl -fsSL -o "$RUNNER_TEMP/tiny.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          "$R/bin/whisper-cli" -m "$RUNNER_TEMP/tiny.bin" -f "$RUNNER_TEMP/t.wav" -nt 2>/dev/null | tee "$RUNNER_TEMP/out.txt"
          grep -qi "recordings" "$RUNNER_TEMP/out.txt"
          echo "-- the server inside the app"
          MATITA_APP_BUNDLE=$PWD/$APP "$R/python/bin/python3" "$R/matita.py" --serve > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8765/api/info > "$RUNNER_TEMP/info.json" && break; sleep 0.5; done
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/info.json'));print({k:d[k] for k in ('version','app','whisper','ffmpeg','capture')});assert d['app'] and d['whisper'] and d['ffmpeg']"
          echo "-- a venv from the bundled Python (speaker identification and Parakeet use one)"
          "$R/python/bin/python3" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q sherpa-onnx==2.0.1 numpy
          "$RUNNER_TEMP/venv/bin/python" -c "import sherpa_onnx; print('sherpa-onnx', sherpa_onnx.__version__)"
          echo "-- Matita Audio starts (no recording permission on CI, so an error or silence is fine)"
          "$APP/Contents/MacOS/matita-audio" "$RUNNER_TEMP/cap.m4a" & CP=$!; sleep 3; touch "$RUNNER_TEMP/cap.m4a.stop"; sleep 2; kill $CP 2>/dev/null || true
          cat "$RUNNER_TEMP/cap.m4a.status" 2>/dev/null || echo "(no status file)"
          kill %1 2>/dev/null || true
          tail -5 "$RUNNER_TEMP/server.log"

      - uses: actions/upload-artifact@v4
        with:
          name: Matita-mac
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow for the icon
        run: python -m pip install -q pillow

      - name: Cache tools (whisper.cpp, FFmpeg, Python)
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            .build-win/whisper
            .build-win/ffmpeg
            .build-win/python
          key: win-tools-v1-whisper-v1.9.5-vulkan-ffmpeg-py3.12

      - name: Vulkan SDK (for the GPU back end)
        if: steps.tools.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile "$env:RUNNER_TEMP\vk.exe"
          $p = Start-Process "$env:RUNNER_TEMP\vk.exe" -ArgumentList "--root","C:\VulkanSDK","--accept-licenses","--default-answer","--confirm-command","install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK install failed ($($p.ExitCode))" }
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\VulkanSDK\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Get-ChildItem C:\VulkanSDK\Bin -Filter glslc.exe

      - name: Build the app folder and the installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-windows.ps1

      - name: Smoke test - tools and a real transcription
        shell: powershell          # Windows PowerShell 5.1 has System.Speech for a test recording
        run: |
          # 5.1 turns anything a program writes to stderr into an error under "Stop"; whisper-cli logs there
          $ErrorActionPreference = "Continue"
          $App = "dist\Matita"
          & "$App\bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          $help = & "$App\bin\whisper-cli.exe" --help 2>&1 | Out-String
          if ($help -notmatch "--vad") { throw "whisper-cli has no VAD" }
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\t.wav"); $s.Speak("Matita turns your recordings into text on your computer."); $s.Dispose()
          $models = "$env:LOCALAPPDATA\Matita\models"; New-Item -ItemType Directory -Force $models | Out-Null
          Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -OutFile "$env:RUNNER_TEMP\tiny.bin"
          # the job below asks for the "fast" model; the tiny one stands in for it
          Copy-Item "$env:RUNNER_TEMP\tiny.bin" "$models\ggml-large-v3-turbo-q8_0.bin"
          $out = & "$App\bin\whisper-cli.exe" -m "$env:RUNNER_TEMP\tiny.bin" -f "$env:RUNNER_TEMP\t.wav" -nt 2>&1 | Out-String
          $out -split "`n" | Where-Object { $_ -match "load_backend|recordings|error" } | ForEach-Object { Write-Host $_ }
          if ($out -notmatch "recordings") { throw "whisper-cli didn't transcribe" }

      - name: Smoke test - Matita itself
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $App = Resolve-Path "dist\Matita"
          $srv = Start-Process "$App\python\python.exe" -ArgumentList "-X","utf8","$App\matita.py","--serve" `
                   -RedirectStandardOutput "$env:RUNNER_TEMP\server.log" -RedirectStandardError "$env:RUNNER_TEMP\server.err" -PassThru
          try {
            python scripts/smoke_job.py "$env:RUNNER_TEMP\t.wav" "recordings" --pause
            if ($LASTEXITCODE -ne 0) { throw "transcription job failed" }
            # a Korean file name, on an English Windows: exercises the short-path handling
            python -c "import shutil,os; shutil.copy(os.path.join(os.environ['RUNNER_TEMP'],'t.wav'), os.path.join(os.environ['RUNNER_TEMP'],'\uD68C\uC758 \uB179\uC74C.wav'))"
            python -c "import subprocess,os,sys; sys.exit(subprocess.call([sys.executable,'scripts/smoke_job.py',os.path.join(os.environ['RUNNER_TEMP'],'\uD68C\uC758 \uB179\uC74C.wav'),'recordings']))"
            if ($LASTEXITCODE -ne 0) { throw "transcription with a Korean file name failed" }
            python -c "import json,urllib.request as u; d=json.load(u.urlopen('http://127.0.0.1:8765/api/info')); print({k:d[k] for k in ('version','app','whisper','ffmpeg','capture','out_dir')}); assert d['app'] and d['whisper'] and d['ffmpeg'] and not d['capture']"
            Get-ChildItem "$env:USERPROFILE\Documents\Transcripts" | ForEach-Object { Write-Host "  saved: $($_.Name)" }
            npm install --no-save --silent playwright@1.49.1
            node scripts/ui_smoke.js msedge
            if ($LASTEXITCODE -ne 0) { throw "the page didn't work in Edge" }
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP\server.log", "$env:RUNNER_TEMP\server.err" -ErrorAction SilentlyContinue | Select-Object -Last 15
          }

      - name: Smoke test - speaker engine and the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $App = Resolve-Path "dist\Matita"
          & "$App\python\python.exe" -m venv "$env:RUNNER_TEMP\venv"
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip install -q sherpa-onnx==2.0.1 numpy
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -c "import sherpa_onnx; print('sherpa-onnx', sherpa_onnx.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "sherpa-onnx didn't load" }
          $setup = Get-ChildItem dist -Filter "Matita-*-setup.exe" | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LANG=en" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer failed ($($p.ExitCode))" }
          $dir = "$env:LOCALAPPDATA\Programs\Matita"
          foreach ($f in "matita.py", "python\pythonw.exe", "bin\whisper-cli.exe", "bin\ffmpeg.exe", "matita.ico") {
            if (-not (Test-Path "$dir\$f")) { throw "installed app is missing $f" }
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Matita.lnk")) { throw "no Start menu shortcut" }
          & "$dir\python\python.exe" -X utf8 "$dir\matita.py" --version
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "$dir\matita.py") { throw "uninstall left the app behind" }
          Write-Host "install and uninstall ok"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Matita-windows
          path: |
            dist/*-setup.exe
            ui-smoke.png
          if-no-files-found: warn

  release:
    needs: [mac, windows]
    if: (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Version
        id: v
        run: |
          echo "version=$(grep -m1 '^VERSION = ' matita.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          find out -type f
          test -n "$(find out -name '*.dmg')" && test -n "$(find out -name '*-setup.exe')"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Matita ${{ steps.v.outputs.version }}
          body_path: .github/release-notes.md
          files: |
            out/**/*.dmg
            out/**/*-setup.exe
